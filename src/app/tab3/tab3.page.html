<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Catálogo Completo</ion-title>
    
    <ion-buttons slot="end">
      <ion-button *ngIf="!mostrarLista" (click)="carregarProdutos()">
        <ion-icon name="download-outline"></ion-icon>
      </ion-button>
      
      <ion-button *ngIf="mostrarLista" (click)="limparDados()">
        <ion-icon name="trash-outline" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <div class="empty-state" *ngIf="!mostrarLista || produtos.length === 0">
    <p>O catálogo está vazio ou foi ocultado.</p>
    <ion-button (click)="carregarProdutos()">Carregar Produtos</ion-button>
  </div>

  <ion-list *ngIf="mostrarLista && produtos.length > 0">
    
    <ion-item *ngFor="let produto of produtos" lines="full">
      
      <ion-avatar slot="start" class="product-avatar">
        <img [src]="produto.image" [alt]="produto.title" />
      </ion-avatar>
      
      <ion-label>
        <h2>{{ produto.title }}</h2>
        <p class="category-text">{{ produto.category }}</p>
        <h3 class="price-text">$ {{ produto.price }}</h3>
      </ion-label>
      
    </ion-item>

  </ion-list>

</ion-content>
